<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Challenge a friend · Functle</title>
	<link rel="stylesheet" href="/lobby.css">
	<script type="module" src="/lobby.js"></script>
</head>
<body>
	<main>
		<header>
			<h1>Functle</h1>
			<p>Challenge a friend</p>
		</header>
		<section aria-labelledby="title">
			<h2 id="title">Challenge lobby</h2>
			<p id="status" role="status">Opening lobby…</p>
			<form id="entry" hidden>
				<label for="name">Your display name</label>
				<input id="name" name="name" autocomplete="nickname" maxlength="32" required>
				<button id="submit">Create room</button>
			</form>
			<div id="room" hidden>
				<div id="sharing">
					<p>Six guesses each. Five minutes. The first player to solve the graph wins.</p>
					<label for="invite">Invite link</label>
					<div class="invite">
						<input id="invite" readonly>
						<button id="copy" class="secondary">Copy link</button>
					</div>
				</div>
				<ul id="players" aria-label="Players"></ul>
				<div id="match" hidden>
					<p id="clock" role="timer"></p>
					<div id="graph"></div>
					<form id="guess-form">
						<label for="guess">Your function</label>
						<input id="guess" maxlength="512" placeholder="e.g. x^2 + 2x - 1" autocomplete="off" spellcheck="false" required>
						<button id="send">Submit guess</button>
					</form>
					<p id="guess-feedback" role="status"></p>
					<p id="answer"></p>
					<div id="histories"></div>
				</div>
				<div class="actions">
					<button id="ready" disabled aria-pressed="false">Ready</button>
					<button id="leave" class="secondary">Leave room</button>
				</div>
			</div>
			<p id="feedback" role="status"></p>
			<a id="create-another" href="/challenge" hidden>Create a new room</a>
		</section>
	</main>
</body>
</html>
