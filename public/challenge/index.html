<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Challenge a friend · Functle</title>
	<meta name="challenge-api" content="https://functle-challenges.zh0ngy0925.workers.dev">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
	<link rel="stylesheet" href="./game/match.css">
	<link rel="stylesheet" href="./lobby.css?v=room-code-row">
	<script type="module" src="./lobby.js?v=room-code-box"></script>
</head>
<body>
	<main class="page">
		<header class="masthead">
			<h1 class="masthead__title">Functle</h1>
			<p class="masthead__sub">Challenge a friend</p>
		</header>
		<section aria-labelledby="title">
			<h2 id="title">Challenge lobby</h2>
			<nav id="match-result-links" aria-label="Room options" hidden>
				<a id="create-after-match" href="/challenge/">Create new room</a>
				<span aria-hidden="true">/</span>
				<a id="leave-after-match" href="/challenge/">Leave room</a>
			</nav>
			<p id="status" role="status">Opening lobby…</p>
			<form id="entry" class="lobby-form" hidden>
				<label for="name">Your display name</label>
				<div class="name-entry">
					<input id="name" name="name" autocomplete="nickname" maxlength="32" required>
					<button id="submit" type="submit" aria-haspopup="dialog">Next</button>
				</div>
			</form>
			<dialog id="room-choice" class="outcome result-dialog" aria-labelledby="room-choice-title">
				<h3 id="room-choice-title" class="outcome__verdict">Choose a room</h3>
				<fieldset id="room-choice-controls">
					<div id="room-options" class="actions">
						<button id="create-room" type="button">Create room</button>
						<button id="choose-join" type="button" class="secondary">Join room</button>
					</div>
					<form id="find-room" class="lobby-form" hidden>
						<label for="room-invite">Room code or lobby link</label>
						<input id="room-invite" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
						<div class="actions">
							<button type="submit">Join room</button>
							<button id="room-choice-back" type="button" class="secondary">Back</button>
						</div>
					</form>
					<button id="close-room-choice" type="button" aria-label="Close">×</button>
				</fieldset>
				<p id="room-choice-feedback" class="outcome__next" role="status"></p>
			</dialog>
			<div id="room" hidden>
				<div id="sharing">
					<p>Six guesses each. Five minutes. The first player to solve the graph wins.</p>
					<h3 class="room-code-label">Room code</h3>
					<div class="room-sharing">
						<strong id="room-code"></strong>
						<button id="copy" type="button" class="outcome__share">Copy link</button>
					</div>
				</div>
				<ul id="players" aria-label="Players"></ul>
				<div id="match" hidden>
					<div id="match-controls" class="actions" hidden>
						<p id="clock" role="timer"></p>
						<button id="forfeit" type="button" class="secondary">Forfeit match</button>
					</div>
					<div id="board"></div>
				</div>
				<div id="room-actions" class="actions">
					<button id="ready" disabled aria-pressed="false">Ready</button>
					<button id="leave" class="secondary">Leave room</button>
				</div>
			</div>
			<p id="feedback" role="status"></p>
			<a id="create-another" href="/challenge/" hidden>Create a new room</a>
		</section>
	</main>
</body>
</html>
